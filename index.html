<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Lumeart Studio - Creative design studio for stunning visual experiences">
  <meta name="theme-color" content="#6dc7d1">
  <meta name="google-site-verification" content="ylkKyyM7sG4q34U0AqST1Y3GgQJ1zSALy9RKHCwo6oI" />
  <title>Lumeart Studio</title>
  
  <!-- Preload critical resources -->
  <link rel="preload" href="/fonts/Manrope-VariableFont_wght.woff2" as="font" type="font/woff2" crossorigin>
  
  <!-- Note: LCP image preload handled by component with fetchPriority="high" -->
  
  <!-- Critical CSS inline - Mobile optimized -->
  <style>
    @font-face {
      font-family: "Manrope";
      src: url("/fonts/Manrope-VariableFont_wght.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      color: #212121;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }

    /* Prevent FOUC (Flash of Unstyled Content) */
    #root {
      min-height: 100vh;
      display: block;
    }

    /* Mobile-specific optimizations */
    @media (max-width: 768px) {
      body {
        -webkit-overflow-scrolling: touch;
      }
    }

    /* Loading state */
    .loading {
      opacity: 0;
      transition: opacity 0.3s ease-in;
    }
    
    .loaded {
      opacity: 1;
    }
  </style>
  
  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
