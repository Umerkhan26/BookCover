<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6dc7d1">
  <meta name="google-site-verification" content="ylkKyyM7sG4q34U0AqST1Y3GgQJ1zSALy9RKHCwo6oI" />

  <link rel="preload" href="/fonts/Manrope-VariableFont_wght.woff2" as="font" type="font/woff2" crossorigin>

  <style>
    @font-face {
      font-family: 'Manrope';
      src: url("/fonts/Manrope-VariableFont_wght.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Manrope', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      background: #ffffff;
      width: 100%;
      max-width: 100%;
    }

    #root {
      min-height: 100vh;
      display: block;
    }

    @media (max-width: 768px) {
      body {
        -webkit-overflow-scrolling: touch;
      }
    }

    .loading {
      opacity: 0;
      transition: opacity 0.3s ease-in;
    }

    .loaded {
      opacity: 1;
    }
  </style>

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

  <!-- DNS Prefetch for external resources -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">

  <!-- Resource Hints for faster loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
